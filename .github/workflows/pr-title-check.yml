name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ ! "$PR_TITLE" =~ ^[A-Z][a-zA-Z0-9\ \-]+(:\ ).+$ ]]; then
            echo "❌ PR title '$PR_TITLE' does not match required format"
            echo "✅ Expected format: '<Feature name>: <description>'"
            echo "✅ Example: 'Payment service: Add payment repository'"
            exit 1
          fi
          echo "✅ PR title format is valid"