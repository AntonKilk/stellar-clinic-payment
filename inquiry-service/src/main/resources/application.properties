spring.application.name=inquiry-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:${INQUIRY_POSTGRES_PORT}/${INQUIRY_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.group-id=inquiry-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.stellar.crm.inquiryservice.kafka.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.stellar.crm.inquiryservice.kafka.dto.CancellationResponse
spring.kafka.consumer.properties.spring.json.use.type.headers=false

stellar.kafka.topic.cancellation-request=cancellation.request
stellar.kafka.topic.cancellation-response=cancellation.response
stellar.kafka.topic.payment-status-updated=payment.status.updated
stellar.kafka.topic.partitions=1
stellar.kafka.topic.replicas=1

# SQL / JPA logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.web=DEBUG